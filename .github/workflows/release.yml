name: Release

# Pushing a `vX.Y.Z` tag is what releases. The owner pushes the tag; everything
# below happens here, never from a laptop. If this workflow is red on a tag,
# the release has not happened: delete the tag rather than fixing it in place.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing and the MCP Registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag, not a branch: the artifact is built from exactly what was
      # tagged, even if main has moved on since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.16"
          # No package-manager cache in the publishing job: the OIDC token that
          # publishes to npm lives in this same job, and a poisoned cache would
          # be restored into it. setup-node's own trusted-publishing guide asks
          # for this. The cost is one uncached `npm ci` per release.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs a newer npm than the 10.9.2
      # bundled with Node 22.16. Pinned to 11 rather than latest: npm 12
      # requires Node ^22.22.2 || ^24.15.0 || >=26.0.0, above the 22.16 floor
      # this package declares and this workflow runs on, so `@latest` fails to
      # install here -- it is what broke the sibling project's first release
      # (2026-09-19, npm 12.0.2, EBADENGINE, twelve seconds in).
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@11
          have="$(npm --version)"
          echo "npm $have"
          # Fail here, with a sentence that says what is wrong, rather than at
          # the publish step with an authentication error nobody can read.
          # 11.5.1 is the floor setup-node's own trusted-publishing guide
          # states; below it the publish fails even with OIDC set up correctly.
          if [ "$(printf '%s\n%s\n' "11.5.1" "$have" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $have cannot publish with OIDC; 11.5.1 or newer is required"
            exit 1
          fi

      - run: npm ci

      # The tag says what this release is; package.json is what npm would
      # publish. A mismatch means the release commit was not the one tagged,
      # so stop before anything is published or announced.
      - name: The tag and package.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # The same suite CI runs on every push, once more on the tagged commit.
      # The performance budgets are excluded for the reason given in ci.yml:
      # they assert wall-clock times that a shared runner cannot measure.
      - run: npm test -- --exclude '**/performance-budget.test.ts'

      - name: The tarball carries dist/ and nothing from tests/
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/index.js" /tmp/pack.txt || { echo "dist/ missing from the tarball"; exit 1; }
          if grep -qE "tests/|fixtures/|\.bin$" /tmp/pack.txt; then
            echo "test files leaked into the tarball"; exit 1
          fi

      # Release notes are the changelog entry, copied verbatim -- never
      # generated from commit titles. A version with no entry is a release
      # nobody wrote notes for, so fail instead of publishing a blank one.
      - name: Take this version's entry out of the changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no entry for $version"
            exit 1
          fi
          # The entry uses reference-style links ([#14]); their definitions live
          # at the foot of the changelog. Without them the notes would render
          # "[#14]" as plain text. Unused definitions render as nothing.
          grep -E '^\[[^]]+\]: ' CHANGELOG.md >> /tmp/notes.md
          cat /tmp/notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag

      # A version can already be on the registry: a tag's workflow gets re-run,
      # and a release can have been published by hand. npm refuses to publish
      # over an existing version, which would fail the run after the GitHub
      # Release was already created, so ask the registry first. Only an exact
      # version match skips the publish; anything else -- no such package, no
      # such version, a registry error -- leaves the answer empty and the
      # publish goes ahead.
      - name: Is this version already on npm?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          found="$(npm view "engine-dj-mcp@$version" version 2>/dev/null || true)"
          if [ "$found" = "$version" ]; then
            echo "already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "not on the registry yet, publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm verifies this repository and this workflow file
      # through OIDC, so there is no token to store or rotate. Provenance ties
      # the published tarball to this run. Skipped when the step above found
      # this exact version already on the registry.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # --- Official MCP Registry -------------------------------------------
      #
      # The registry lists server.json and points at the npm package above; it
      # checks ownership by reading `mcpName` from the package.json npm serves
      # for this version, so this runs only after npm has the version. It is
      # published with the GitHub Actions OIDC token -- no stored secret. An
      # interactive login under a personal account into the organisation's
      # namespace is refused (403, registry issues #1649 and #1537), so this
      # workflow is the only way this server reaches the registry.

      # Pinned, like npm above, and checked against the release's own
      # checksums file rather than piped from `releases/latest`: the binary
      # that gets this job's OIDC token is exactly the one read here. To move
      # to a newer release, change both values, taking the sha256 of
      # mcp-publisher_linux_amd64.tar.gz from that release's
      # registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --version

      # The same guard as the npm step: a re-run tag, or a version someone
      # already published, is skipped with a message instead of failing the
      # run. Only a 200 for this exact name and version skips; a 404 or
      # anything else goes on to publish, and a genuine duplicate is then
      # refused by the registry itself.
      - name: Is this version already in the MCP Registry?
        id: registry
        run: |
          version="${{ steps.version.outputs.version }}"
          name="$(node -p 'require("./server.json").name')"
          encoded="$(jq -rn --arg n "$name" '$n|@uri')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${version}" || true)"
          if [ "$status" = "200" ]; then
            echo "$name $version is already in the MCP Registry, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version not in the MCP Registry yet (HTTP $status), publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The registry reads mcpName from npm the moment it is asked, and a
      # version published seconds ago can still be missing from the registry
      # npm serves. Wait until npm answers with this version's mcpName, and
      # say so plainly if it never does -- a version published before
      # mcpName existed can never be listed.
      - name: Wait until npm serves this version's mcpName
        if: steps.registry.outputs.skip != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          want="$(node -p 'require("./server.json").name')"
          for attempt in $(seq 1 30); do
            got="$(npm view "engine-dj-mcp@$version" mcpName 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "npm serves engine-dj-mcp@$version with mcpName $got"
              exit 0
            fi
            sleep 10
          done
          echo "npm does not serve engine-dj-mcp@$version with mcpName $want after 5 minutes"
          exit 1

      - name: Log in to the MCP Registry with GitHub OIDC
        if: steps.registry.outputs.skip != 'true'
        run: /tmp/mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.skip != 'true'
        run: /tmp/mcp-publisher publish server.json
